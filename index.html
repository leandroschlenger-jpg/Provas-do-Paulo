<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Paulo | Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">PA</span>
    <div class="brand-txt">
      <strong>PAULO</strong>
      <span id="tb-rank">—</span>
    </div>
  </div>
  <div class="tb-right">
    <div class="tb-lvl">
      <span class="tb-lvl-n" id="tb-level">1</span>
      <span class="tb-lvl-l">LVL</span>
    </div>
    <div class="tb-xp">
      <div class="tb-xp-bar"><i id="tb-xp-fill"></i></div>
      <span class="tb-xp-txt" id="tb-xp-txt">0 / 300 XP</span>
    </div>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar"></nav>

<div id="toast" class="toast"></div>

<script src="js/data-historia.js?v=2"></script>
<script src="js/data-ingles.js?v=2"></script>
<script src="js/data-reforco.js?v=2"></script>
<script src="js/state.js?v=2"></script>
<script src="js/analysis.js?v=2"></script>
<script src="js/quiz.js?v=2"></script>
<script src="js/panels.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
